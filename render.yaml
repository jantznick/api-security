# Render Blueprint — source of truth for static sites (SPA rewrites live here).
#
# Render ignores Netlify-style `_redirects`. The `routes` rewrite below is what
# keeps hard refresh of `/projects`, `/admin`, `/billing`, `/how-it-works`, etc.
# serving `index.html` after every deploy.
#
# One-time (Nick): if these sites were created manually (not via Blueprint):
#   1. Render Dashboard → New → Blueprint → connect this repo (path: render.yaml).
#   2. Match `name:` below to existing service names (rename services in Dashboard
#      OR edit `name:` here) so Apply updates them instead of creating duplicates.
#   3. Deploy / sync Blueprint once. Auto-sync thereafter applies `routes` from git.
# After that, no Dashboard Redirects/Rewrites clicks are required.
#
# Docs: docs/RENDER.md

services:
  - type: web
    name: apiglimpse-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.apiglimpse.com
      - key: VITE_MARKETING_URL
        value: https://apiglimpse.com
      - key: VITE_APP_URL
        value: https://app.apiglimpse.com
      - key: VITE_DOCS_URL
        value: https://docs.apiglimpse.com
      - key: VITE_COLLECT_URL
        value: https://collect.apiglimpse.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: apiglimpse-marketing
    runtime: static
    rootDir: marketing
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.apiglimpse.com
      - key: VITE_APP_URL
        value: https://app.apiglimpse.com
      - key: VITE_DOCS_URL
        value: https://docs.apiglimpse.com
      - key: VITE_COLLECT_URL
        value: https://collect.apiglimpse.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: apiglimpse-docs
    runtime: static
    rootDir: docs-site
    buildCommand: npm install && npm run build
    staticPublishPath: docs/.vitepress/dist
    # VitePress emits real HTML paths; no SPA catch-all rewrite.
