[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiglimpse"
version = "0.1.0"
description = "FastAPI / Starlette middleware that sends API traffic metadata to API Glimpse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "API Glimpse" }]
keywords = [
  "fastapi",
  "starlette",
  "middleware",
  "api-security",
  "discovery",
  "observability",
  "apiglimpse",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "httpx>=0.27",
  "starlette>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/jantznick/api-security/tree/main/connectors/python"
Repository = "https://github.com/jantznick/api-security"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
