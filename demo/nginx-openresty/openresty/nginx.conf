worker_processes 1;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

# Allow Lua to read sensor env vars
env API_SENSOR_AGENT_URL;
env API_SENSOR_KEY;
env API_SENSOR_SERVICE_NAME;
env API_SENSOR_SAMPLE_RATE;
env API_SENSOR_MAX_BODY_BYTES;

events {
  worker_connections 1024;
}

http {
  lua_package_path "/etc/nginx/lua/?.lua;;";
  lua_need_request_body on;

  init_worker_by_lua_block {
    require("apiglimpse").init({
      flush_interval_ms = 500,
      max_batch = 10,
    })
  }

  upstream echo_upstream {
    server upstream:8080;
  }

  server {
    listen 80;
    server_name _;

    location /healthz {
      access_by_lua_block {
        require("apiglimpse").capture_request_body()
      }
      content_by_lua_block {
        ngx.header["Content-Type"] = "application/json"
        ngx.say('{"status":"ok","gateway":"openresty-demo"}')
      }
      body_filter_by_lua_block {
        require("apiglimpse").capture_response_chunk()
      }
      log_by_lua_block {
        require("apiglimpse").log_request()
      }
    }

    location / {
      access_by_lua_block {
        require("apiglimpse").capture_request_body()
      }

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://echo_upstream;

      body_filter_by_lua_block {
        require("apiglimpse").capture_response_chunk()
      }

      log_by_lua_block {
        require("apiglimpse").log_request()
      }
    }
  }
}
